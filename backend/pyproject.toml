[project]
name = "backend"
version = "0.1.0"
description = "AICTE Approval Intelligence Platform Backend API"
readme = "README.md"
authors = [
    { name = "Karthikeyan S", email = "karthikeyan58583@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
